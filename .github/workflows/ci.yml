name: CI

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conveyor
          POSTGRES_PASSWORD: conveyor
          POSTGRES_DB: conveyor
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U conveyor -d conveyor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://conveyor:conveyor@localhost:5433/conveyor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest -q
      # The SDK is a distribution, so build and install it as one rather than
      # trusting that it imports from the source tree.
      - name: Build and install the SDK
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist/
          python -m pip install --force-reinstall dist/*.whl
      - name: The wheel contains the SDK and nothing else
        run: |
          python -c "
          import zipfile, glob, sys
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          modules = {n.split('/')[0] for n in names if not n.endswith('.dist-info') and '.dist-info/' not in n}
          assert modules == {'conveyor_client'}, modules
          assert 'conveyor_client/py.typed' in names, 'py.typed missing: the package is not typed to consumers'
          print(sorted(names))
          "
      - name: The installed package works outside the source tree
        working-directory: /tmp
        run: python -c "import conveyor_client; print(conveyor_client.__version__, conveyor_client.Client)"

